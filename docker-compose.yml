services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: learniee
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: learniee
    volumes: [pgdata:/var/lib/postgresql]
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on: [db]
  scheduler:
    build: ./scheduler
    restart: unless-stopped
    environment:
      APP_URL: http://app:3000
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET in .env (same value the app uses)}
    depends_on: [app]
  migrate:
    build: { context: ., target: builder }
    profiles: ["tools"]
    env_file: .env
    command: npx prisma migrate deploy
    depends_on: [db]
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes: [./Caddyfile:/etc/caddy/Caddyfile, caddy_data:/data]
volumes: { pgdata: {}, caddy_data: {} }